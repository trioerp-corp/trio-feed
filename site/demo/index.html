}

  return `<div class="ph"><div><h1>تقرير اليوم</h1><span class="muted">${now().toLocaleDateString("ar-EG")} · يشمل بيانات تجريبية + فواتيرك</span></div><button class="btn" data-a="print2">طباعة</button></div>
  <div class="two"><div class="card"><h2>المبيعات حسب طريقة الدفع</h2><ul class="rows"><li><span>💵 نقدي (في الدرج)</span><b>${fmt(t.cash)} ج</b></li><li><span>💳 بطاقة</span><b>${fmt(t.card)} ج</b></li><li><span>📲 InstaPay</span><b>${fmt(t.insta)} ج</b></li>${cl ? `<li><span>🏥 آجل على شركات التأمين</span><b>${fmt(t.ins)} ج</b></li>` : ""}<li><b>الإجمالي</b><b>${fmt(t.sum)} ج</b></li></ul></div>
  <div class="card"><h2>الربح</h2><ul class="rows"><li><span>المبيعات</span><b>${fmt(t.sum)} ج</b></li><li><span>تكلفة البضاعة${cl ? " والمستهلكات" : ""}</span><b>${fmt(cost)} ج</b></li><li><span>الخصومات</span><b>${fmt(t.disc)} ج</b></li><li><b>ربح اليوم</b><b class="ok">${fmt(t.profit)} ج</b></li></ul></div></div>
  <div class="card" style="margin-top:14px"><h2>فواتيرك في التجربة</h2>${S.sales.length ? `<ul class="rows">${S.sales.slice().reverse().map(s => `<li><span>#${s.no} · ${hm(s.at)} · ${PAYN[s.pay]}${s.label ? " · " + E(s.label) : ""}</span><b>${fmt(s.tot + s.ins)} ج</b></li>`).join("")}</ul>` : `<p class="muted">لسه ما عملتش فاتورة.</p>`}</div>`; };

/* ---------- start screen ---------- */
function startScreen(pre){
  const P = POP.map(k => LIB.find(p => p.k === k)).filter(Boolean);
  $("root").innerHTML = `<div class="start"><div class="box"><div class="mark"><img src="../logo.png" alt=""><span>Trio</span><a href="../" style="margin-inline-start:auto;font-size:14px;font-weight:500">← الموقع</a></div>
  <h1>جرّب برنامجك قبل ما تنزّله</h1><p class="lead">اكتب اسم محلك ونشاطك، وهتلاقي برنامجك جاهز بأصنافك وأسعار تقريبية — اضغط واعمل فاتورة تجربة.</p>
  <div class="card"><label>اسم المحل<input id="sShop" maxlength="40" placeholder="مثلًا: صيدلية الشفاء" value="${E(pre.s || "")}"></label>
  <label>نشاطك<input id="sAct" list="sList" autocomplete="off" placeholder="مثلًا: كافيه، صيدلية، قطع غيار…" value="${E(pre.a || "")}"></label><datalist id="sList">${LIB.map(p => `<option value="${E(p.n)}">`).join("")}</datalist>
  <div class="chips">${P.map(p => `<button type="button" data-a="spop" data-v="${E(p.n)}">${E(p.n)}</button>`).join("")}</div>
  <button class="btn p w" data-a="sgo">افتح برنامجي</button></div>
  <p class="fine">تجربة مبسطة بتشتغل على المتصفح بس — مفيش حاجة بتتبعت لأي حد، والبيانات بتفضل على جهازك. البرنامج الحقيقي بيتثبت على كمبيوتر المحل ويشتغل من غير إنترنت.</p></div></div>`;
  $("sAct").addEventListener("keydown", e => { if (e.key === "Enter") A.sgo(); }); }

/* ---------- actions ---------- */
function dl(){ if (!isPhone) { window.open(DOWNLOAD, "_blank", "noopener"); return; }
  modal(mh("البرنامج بيتثبت على كمبيوتر المحل") + `<p>Trio بيشتغل على كمبيوتر ويندوز في المحل (من غير إنترنت). افتح الرابط من الكمبيوتر ونزّله من هناك — التجربة 14 يوم مجانًا.</p>
  <div class="mbtns"><a class="btn p" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("تحميل Trio (افتحه من كمبيوتر المحل): " + DOWNLOAD)}">ابعت الرابط لنفسي على واتساب</a><a class="btn" target="_blank" rel="noopener" href="${DOWNLOAD}">نزّله على الموبايل برضه</a></div>`); }
const A = {
  menu(){ const s = $("side"); s.classList.add("open"); const c = document.createElement("div"); c.className = "scrim"; c.dataset.a = "scrim"; document.body.appendChild(c); },
  scrim: closeMenu,
  go(v){ go(v); },
  locked(){ toast("القسم ده موجود في البرنامج الكامل — نزّله وجرّبه 14 يوم"); },
  reset(){ if (!confirm("نمسح التجربة ونبدأ من الأول؟")) return; try { localStorage.removeItem(KEY); } catch (e) {} S = null; clearInterval(tk); startScreen({}); },
  dl, close: mclose,
  ovx(v, el, e){ if (e.target === el) mclose(); },
  spop(v){ $("sAct").value = v; document.querySelectorAll(".chips button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); },
  sgo(){ const a = $("sAct").value.trim(); if (a.length < 2) { $("sAct").focus(); toast("اكتب نشاطك أو اختار من اللي تحت"); return; }
    S = newState($("sShop").value, a); tab = "الكل"; qry = ""; save(); shell(); },
  tab(v){ tab = v; refresh(); },
  pick(v){ pick(v); },
  addv(v, el){ const x = item(v), o = el.dataset.o; mclose();
    if (o === "box") return addLine(x, x.n + " (علبة)", x.p, x.s); if (o === "strip") return addLine(x, x.n + " (شريط)", Math.ceil(x.p / x.s), 1);
    const s = sizes(x)[+o]; addLine(x, x.n + " — " + s[0], x.p + s[1], 1); },
  altpick(v){ mclose(); pick(v); },
  vsel(v, el){ vSel.s = v; vSel.c = el.dataset.o; varModal(item(vSel.id)); },
  vadd(){ const x = item(vSel.id); const vk = vSel.s + "|" + vSel.c; const inCart = lines().filter(l => l.vk === vk && l.id === x.id).reduce((a, l) => a + l.q, 0);
    if (inCart >= x.v[vk]) { toast("مفيش أكتر من كده في المخزن"); return; } mclose(); addLine(x, `${x.n} — ${vSel.s} / ${vSel.c}`, x.p, 1, vk); vSel = {}; },
  qty(v, el){ const l = lines(), i = +v, d = +el.dataset.d; if (!l[i]) return; l[i].q += d; if (l[i].q <= 0) l.splice(i, 1); else if (d > 0) did("qty"); save(); refresh(); if (ctx[0] === "d") bufModal(ctx.slice(2)); },
  clear(){ S.cart = []; save(); refresh(); },
  tocart(){ const c = $("cart"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); },
  pay(){ if (!S.cart.length) return; pay = null; payModal("pos"); },
  pm(v){ pay.m = v; payModal(pay.kind, pay.extra); },
  paidq(v){ pay.paid = +v; payModal(pay.kind, pay.extra); },
  confirm: confirmPay,
  print(){ window.print(); }, print2(){ toast("في البرنامج: التقرير بيتطبع على الطابعة أو يتبعت واتساب"); },
  table(v){ ctx = "t:" + v; if (!S.tables[v]) { S.tables[v] = { lines: [], t0: Date.now() }; did("table"); } S.view = "table"; save(); closeMenu(); renderSide(); $("main").innerHTML = V.table(); window.scrollTo(0, 0); },
  kitchen, bill, paytbl(){ pay = null; payModal("table", { label: "طاولة " + ctx.slice(2) }); },
  dstart(v, el){ const d = S.dev.find(x => x.id === v); d.on = { t0: Date.now(), multi: +el.dataset.o, buf: [] }; did("start"); save(); refresh(); toast("بدأ " + d.n + " — العداد شغال"); },
  buf(v){ bufModal(v); },
  bufadd(v){ const x = item(v); const l = lines(); const f = l.find(a => a.id === v); if (f) f.q++; else l.push({ k: v, id: v, n: x.n, q: 1, p: x.p, c: x.c }); did("buffet"); save(); refresh(); bufModal(ctx.slice(2)); toast("اتضاف: " + x.n); },
  dclose(v){ dclose(v); }, paydev(){ pay = null; payModal("dev", devExtra); },
  walkin, wsave(){ const n = $("wn").value.trim() || "مريض جديد"; S.q.splice(S.q.findIndex(p => p.stt === "book") >= 0 ? S.q.findIndex(p => p.stt === "book") : S.q.length, 0, { id: "p" + Date.now(), n, ph: $("wp").value.trim(), svc: $("ws").value, ins: $("wi").value, stt: "wait", rx: [] });
    did("walkin"); save(); mclose(); refresh(); toast("اتضاف " + n + " للدور"); },
  call(v){ S.q.forEach(p => { if (p.stt === "doc") p.stt = "wait"; }); S.q.find(p => p.id === v).stt = "doc"; save(); go("doc"); },
  dxq(v){ rxDraft.dx = rxDraft.dx ? rxDraft.dx + "، " + v : v; refresh(); },
  rxq(v){ rxDraft.rx.push(RX[+v].slice()); refresh(); }, rxdel(v){ rxDraft.rx.splice(+v, 1); refresh(); },
  dfinish(){ const p = S.q.find(x => x.stt === "doc"); if (!rxDraft.dx.trim()) { toast("اكتب التشخيص الأول"); return; } p.dx = rxDraft.dx; p.cc = rxDraft.cc; p.rx = rxDraft.rx; p.stt = "pay"; rxDraft = null; did("doctor"); save(); go("recep"); toast("اتحوّل للخزينة — اضغط «ادفع»"); },
  cpay(v){ const p = S.q.find(x => x.id === v), sv = svcOf(p); pay = null; payModal("clinic", { pid: p.id, price: sv.p, svcN: sv.n, pn: p.n, ins: p.ins }); },
  newitem: newItem,
  isave(){ const n = $("nn").value.trim(), p = parseFloat($("np").value); if (!n || !(p > 0)) { toast("اكتب الاسم والسعر"); return; } const ex = {};
    document.querySelectorAll("[data-f]").forEach(i => { if (i.value.trim()) ex[i.dataset.f] = i.value.trim(); });
    const k = parseFloat($("nk").value); S.items.push({ id: "n" + Date.now(), n, p, c: k > 0 ? k : Math.round(p * .74), cat: $("nc").value, ex, st: parseInt($("ns").value, 10) || 0, sold: 0 });
    save(); mclose(); refresh(); toast("اتحفظ «" + n + "» — وبقى ظاهر في الكاشير"); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el || el.disabled) return; const f = A[el.dataset.a]; if (!f) return; if (el.tagName === "A") return; f(el.dataset.v, el, e); });
document.addEventListener("input", e => { const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === "srch") { qry = el.value; const t = $("tiles"); if (t) t.innerHTML = tilesOnly(); return; }
  if (k === "disc" || k === "paid") { const v = parseFloat(el.value) || 0; if (k === "disc") { pay.disc = Math.max(0, Math.min(pay.s0, v)); const ins = INS.find(i => i[0] === pay.ins) || INS[0]; const ad = pay.s0 - pay.disc; pay.insAmt = pay.kind === "clinic" ? Math.round(ad * ins[2] / 100) : 0; pay.tot = ad - pay.insAmt; } else { pay.paid = v; pay.paidV = v; }
    const pt = $("ptot"); if (pt) pt.textContent = fmt(pay.tot) + " ج"; const ch = $("chg"); if (ch) ch.textContent = fmt(Math.max(0, (pay.paid == null ? pay.paidV : pay.paid) - pay.tot)) + " ج";
    const b = $("cfm"); if (b) b.disabled = pay.m === "cash" && (pay.paid == null ? pay.paidV : pay.paid) < pay.tot; return; }
  if (k === "cc" || k === "dx") { rxDraft[k] = el.value; return; }
  if (k === "rxn" || k === "rxd") { rxDraft.rx[+el.dataset.i][k === "rxn" ? 0 : 1] = el.value; } });
document.addEventListener("change", e => { const el = e.target; if (el.dataset && el.dataset.in === "ins") { pay.ins = el.value; pay.paid = null; payModal(pay.kind, pay.extra); }
  if (el.dataset && el.dataset.in === "disc") { pay.paid = null; payModal(pay.kind, pay.extra); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") mclose(); });

/* ---------- boot ---------- */
const qs = new URLSearchParams(location.search), qa = (qs.get("a") || "").trim(), qsh = (qs.get("s") || "").trim();
S = load();
if (qa && (!S || S.an !== qa)) { const m = LIB.find(p => p.k === qa); S = newState(qsh, m ? m.n : qa); save(); history.replaceState(null, "", location.pathname); }
if (S) { if (S.view === "table") S.view = "tables"; shell(); } else startScreen({ s: qsh });
})();
</script></body></html>
