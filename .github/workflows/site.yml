name: Deploy Trio site
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}
concurrency: { group: site, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 66ab03975f031d18baf0aeb4ccde2a11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy to Cloudflare Pages (trioerp.pages.dev)
        run: npx --yes wrangler@3.114.0 pages deploy site --project-name=trioerp --branch=main --commit-dirty=true
