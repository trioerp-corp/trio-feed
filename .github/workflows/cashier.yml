# «Trio – الكاشير» (1.26.1): a cashier PC installed from the file the owner's program makes — built and tested on real Windows.
# Owner = the public package + app/ + the new launcher; cashier = the setup file downloaded from /c with a one-time code.
# Results → branch qa-results, folder cashier/ (log.txt, screenshots).
name: Cashier PC on Windows
on:
  workflow_dispatch:
  push:
    branches: [qa]
    paths: ["setup/cashier/**", "setup/cashier-test.ps1", "setup/cashier_ci.py", ".github/workflows/cashier.yml"]
concurrency: { group: cashier, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  cashier:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22", cache: false }
      - name: Go unit tests (launcher discovery, cashier proxy / cache / payload)
        shell: pwsh
        run: |
          cd setup\launcher; go vet .; go test ./...; if ($LASTEXITCODE) { exit 1 }
          cd ..\cashier; go vet .; go test ./...; if ($LASTEXITCODE) { exit 1 }
      - name: Build TrioWindow.exe, Trio.exe, TrioCashier.exe
        shell: pwsh
        run: |
          dotnet build setup\window\TrioWindow.csproj -c Release -o build\window -nologo -v minimal; if ($LASTEXITCODE) { exit 1 }
          cd setup\launcher; go build -ldflags "-s -w -H windowsgui" -o ..\..\build\Trio.exe .; if ($LASTEXITCODE) { exit 1 }
          cd ..\cashier; go build -ldflags "-s -w -H windowsgui" -o ..\..\build\TrioCashier.exe .; if ($LASTEXITCODE) { exit 1 }
      - name: The owner's program (public download + app/ + new launcher + window + cashier stub)
        shell: pwsh
        run: |
          gh release download v1.23.1 -R $env:GITHUB_REPOSITORY -p Trio-online.zip -D base
          Expand-Archive base\Trio-online.zip -DestinationPath C:\pkg
          robocopy app C:\pkg\Trio /E /NFL /NDL /NJH /NJS /NP | Out-Null
          Copy-Item build\Trio.exe C:\pkg\Trio\Trio.exe -Force
          Copy-Item build\Trio.exe "C:\pkg\Trio\Trio Cashier.exe" -Force
          Remove-Item C:\pkg\Trio\.acc-flash -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force C:\pkg\Trio\window, C:\pkg\Trio\pos\bin | Out-Null
          Copy-Item build\window\* C:\pkg\Trio\window\ -Recurse -Force -Exclude *.pdb,*.xml
          Remove-Item -Recurse -Force C:\pkg\Trio\window\runtimes, C:\pkg\Trio\window\Microsoft.Web.WebView2.Wpf.dll -ErrorAction SilentlyContinue
          Copy-Item build\TrioCashier.exe C:\pkg\Trio\pos\bin\TrioCashier.exe -Force
          exit 0
      - name: Test (code → /c → install → shortcut + Apps entry → discovery → proxy → owner off → cache → back → uninstall)
        shell: pwsh
        run: pwsh -NoProfile -File setup\cashier-test.ps1 -App C:\pkg\Trio -Out out
      - name: Results → branch qa-results (cashier/)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          git config --global user.name "Trio QA"; git config --global user.email "trioerp.corp@gmail.com"
          git clone -q --depth 1 --branch qa-results "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" res
          rm -rf res/cashier; mkdir -p res/cashier
          cp out/*.png out/*.txt out/*.log res/cashier/ 2>/dev/null
          cp /c/pkg/Trio/data/trio.log res/cashier/owner-trio.log 2>/dev/null
          echo "run ${{ github.run_id }} $(date -u)" > res/cashier/RUN.txt
          cd res && git add -A cashier && git commit -q -m "cashier test (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git push -q origin HEAD:qa-results && break; git pull -q --rebase origin qa-results || true; sleep 5; done
