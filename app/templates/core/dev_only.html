{% extends "base.html" %}{% block title %}مطور النظام{% endblock %}
{% block content %}<div class="card" style="max-width:460px;margin:40px auto;text-align:center"><h1>🔒 للمطور فقط</h1>
<p class="muted">هذا الجزء (الحسابات والإعدادات الكاملة) يُفتح بحساب مطور النظام فقط.</p><a class="btn" href="/">الرجوع للرئيسية</a>
<p><a href="/logout/" onclick="event.preventDefault();document.getElementById('lo').submit()">الدخول بحساب المطور</a></p>
<form id="lo" method="post" action="{% url 'logout' %}">{% csrf_token %}</form></div>{% endblock %}
