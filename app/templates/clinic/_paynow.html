{# «دُفع الآن»: pay the booked service at the reception and print the booking receipt #}
<div class="paynow" style="border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px">
<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" name="pay_now" value="1" class="pn"> دفع الآن وطباعة الإيصال</label>
<div class="pnb" style="display:none;margin-top:8px"><div class="form-grid">
<label class="field">الدفع<select name="pay" class="pm"><option value="cash">نقدي (المؤمَّن عليه يدفع حصته فقط)</option><option value="card">بطاقة / محفظة (المؤمَّن عليه: حصته فقط)</option><option value="credit">آجل على المريض</option><option value="split">جزء وجزء</option><option value="cash_full">بدون تأمين — نقدي كامل</option></select></label>
<label class="field">خصم<input name="discount" value="0" inputmode="decimal" dir="ltr" class="pd"></label></div>
<div class="po form-grid" style="display:none"><label class="field">خصم فوق المسموح: اسم مستخدم صاحب العيادة<input name="owner" autocomplete="off"></label><label class="field">كلمة السر<input name="owner_password" type="password" autocomplete="new-password"></label></div>
<div class="ps form-grid" style="display:none"><label class="field">بطاقة<input name="card" inputmode="decimal" dir="ltr"></label><label class="field">آجل<input name="credit" inputmode="decimal" dir="ltr"></label></div>
<p class="muted" style="font-size:12px;margin:4px 0 0">يُحتسب سعر الخدمة المختارة (أو أول خدمة للطبيب). وأي خدمة إضافية يضيفها الطبيب تُحاسب بإيصال آخر.</p></div></div>
<script>(function(){document.querySelectorAll('.paynow').forEach(function(w){if(w.dataset.on)return;w.dataset.on=1;var c=w.querySelector('.pn'),b=w.querySelector('.pnb'),m=w.querySelector('.pm'),sp=w.querySelector('.ps');
c.onchange=function(){b.style.display=c.checked?'block':'none'};var pd=w.querySelector('.pd'),po=w.querySelector('.po');pd.oninput=function(){po.style.display=(parseFloat(pd.value)||0)>0?'grid':'none'};m.onchange=function(){sp.style.display=m.value=='split'?'grid':'none'}})})();</script>
