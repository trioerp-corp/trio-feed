{% if page.paginator.num_pages > 1 %}<nav class="pager" aria-label="الصفحات">{% if page.has_previous %}<a class="btn light" href="?{{ params }}&page={{ page.previous_page_number }}">السابق</a>{% endif %}
<span class="muted">صفحة {{ page.number }} من {{ page.paginator.num_pages }} — {{ page.paginator.count }} سجل</span>
