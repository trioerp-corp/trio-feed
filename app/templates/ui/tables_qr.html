<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أكواد QR للترابيزات</title>
<style>@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#0B1F3A;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{padding:12px;text-align:center;background:#EEF2F7}.bar button{font:700 16px Tahoma;padding:10px 24px;border-radius:10px;border:0;background:#17698F;color:#fff;cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8mm;padding:8mm}.c{border:2px solid #0B1F3A;border-radius:6mm;padding:6mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
.c h1{margin:0;font-size:20pt}.c h2{margin:2mm 0;font-size:28pt;background:#0B1F3A;color:#fff;border-radius:4mm;padding:1mm 0}.c .qr svg{width:55mm;height:55mm;display:block;margin:3mm auto}.c .logo{width:18mm;height:18mm;margin:0 auto 2mm;display:flex;align-items:center;justify-content:center}.c .logo svg{max-width:18mm;max-height:18mm;width:100%;height:100%}
.c p{margin:0;font-size:13pt;font-weight:700}.c small{display:block;margin-top:2mm;color:#55657A;font-size:9pt}@media print{.bar{display:none}}</style></head><body>
<div class="bar"><button onclick="print()">🖨 طباعة</button></div><div class="g">
{% for c in cards %}<div class="c">{% if s.logo_svg %}<div class="logo">{{ s.logo_svg|safe }}</div>{% endif %}<h1>{{ s.name }}</h1><h2>{{ c.t.name }}</h2><div class="qr">{{ c.qr|safe }}</div><p>{% if order %}امسح الرمز — تصفّح المنيو واطلب من هاتفك{% else %}امسح الرمز لتصفّح المنيو{% endif %}</p><small>منيو إلكتروني بواسطة تريو</small></div>
{% empty %}<p>لا توجد ترابيزات تعمل.</p>{% endfor %}</div></body></html>
