{% load l10n %}{% if is_owner %}<details class="void"><summary class="badge red" style="cursor:pointer">{{ label|default:"إلغاء" }}</summary>
<form method="post" action="{% url 'shop_void' %}" style="display:flex;gap:6px;margin-top:6px">{% csrf_token %}<input type="hidden" name="what" value="{{ what }}"><input type="hidden" name="id" value="{{ id|unlocalize }}">{% if code %}<input type="hidden" name="code" value="{{ code }}">{% endif %}
<input type="hidden" name="next" value="{{ request.get_full_path }}"><input name="reason" placeholder="السبب" required style="min-width:120px"><button class="danger">تأكيد</button></form></details>{% endif %}
